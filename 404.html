<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>الصفحة غير موجودة – تعريب أوموري</title>
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<style>
  @font-face { font-family: "OMORI GAME"; src: url("/assets/fonts/OMORI_GAME2.woff2") format("woff2"); font-display: swap; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; padding: 24px; background: #000; color: #fff;
    font-family: "OMORI GAME", "Segoe UI", Tahoma, sans-serif; font-size: 19px; line-height: 1.9; text-align: center; }
  main { max-width: 520px; }
  .code { margin: 0; font-size: clamp(64px, 18vw, 120px); line-height: 1.1; color: #a020f0; direction: ltr; }
  h1 { margin: 0 0 8px; font-weight: normal; font-size: clamp(24px, 5vw, 32px); }
  p { margin: 0 0 28px; color: rgba(255,255,255,.6); }
  .menu { display: grid; gap: 6px; padding: 14px 18px; border: 3px solid #fff; border-radius: 12px; text-align: start; }
  .menu a { display: flex; align-items: center; gap: 12px; padding: 6px 8px; color: #fff; text-decoration: none; border-radius: 8px; }
  .menu a::before { content: ""; width: 26px; height: 20px; flex: none; opacity: 0; background: url("/assets/img/cursor_menu.png") center / contain no-repeat; }
  .menu a:hover::before, .menu a:focus-visible::before { opacity: 1; }
  .menu a:focus-visible { outline: 3px solid #ffd11f; outline-offset: 2px; }
  .menu a[lang="en"] { direction: ltr; }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>هذه الصفحة غير موجودة</h1>
  <p>ربما انتقلت أو كُتب الرابط بشكل خاطئ.</p>
  <nav class="menu" aria-label="روابط مفيدة">
    <a href="/">العودة إلى صفحة التعريب</a>
    <a href="/en/" lang="en" hreflang="en">English version</a>
  </nav>
</main>
</body>
</html>
